section:
  name: Selected projects
  id: projects
  enable: true
  weight: 2
  showOnNavbar: false

projects:

- name: Fine-tuning lab
  url: "https://yinchi.dev/fine-tuning-lab/404_summary.html"
  summary: >
    LoRA fine-tuning experiments on the [ConvFinQA](https://arxiv.org/abs/2210.03849) financial
    question answering dataset, using a Qwen3-4B base model.
  tags: ["hobby", "machine learning"]

- name: VirtOS
  url: "https://github.com/yinchi/virtos"
  summary: >
    A minimal operating system for the QEMU emulator with VirtIO devices.
  tags: ["hobby", "operating system", "rust"]

- name: LLM chatbot demo
  url: "https://github.com/yinchi/openai_demo"
  summary: >
    A simple command-line chatbot using the OpenAI Chat Completions API, with support for
    file read/write, Python code execution, and web search via the Brave Search API.
  tags: ["hobby", "chatbot", "python"]

- name: QR code explainer
  url: "https://yinchi.dev/qr"
  summary: >
    An interactive guide to QR codes, explaining their structure, encoding, and decoding processes.
    Covers GF(2⁸) and Reed-Solomon error correction.
  tags: ["hobby", "qr code", "typescript"]

- name: Ring Puzzle
  url: "https://yinchi.github.io/ring_puzzle/"
  summary: >
    Clone of the classic Top Spin puzzle by Binary Arts. Includes an auto-solver based on a
    greedy algorithm plus an endgame table lookup.
    [Read the write-up](https://yinchi.dev/posts/top-spin/).
  tags: ["hobby", "puzzle"]

- name: HarvardX Movielens Project
  url: "https://yinchi.github.io/harvardx-movielens/"
  summary: >
    R project for the edX course HarvardX PH125.9x "Data Science: Capstone" &mdash; a movie
    recommendation system using linear regression with matrix factorisation, achieving an
    RMSE of 0.782 on the test set.
  tags: ["academic", "r"]

- name: HarvardX Higgs Classification
  url: "https://yinchi.github.io/harvardx-higgs/"
  summary: >
    R project for the edX course HarvardX PH125.9x "Data Science: Capstone" &mdash; neural
    network classification of particle collision events from the HIGGS dataset, achieving an
    AUC of 0.877.
  tags: ["academic", "r"]

- name: CodeCrafters Profile
  url: "https://app.codecrafters.io/users/yinchi"
  summary: >
    Progress tracker for CodeCrafters coding challenges &mdash; building simplified versions
    of an HTTP server, a tree-walk interpreter for the Lox language, and a CLI LLM tool.
  tags: ["hobby", "codecrafters"]
