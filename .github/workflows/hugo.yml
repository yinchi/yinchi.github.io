name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
      DART_SASS_VERSION: 1.102.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Matches local dev's Node version. Older npm (bundled with e.g. Node 20) resolves
          # package.json's "overrides" field differently when combined with the npm
          # workspaces setup here (packages/hugoautogen) -- `npm ci` flagged a false
          # lockfile-mismatch under Node 20/npm 10 that doesn't reproduce under this version.
          node-version: 26
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      # Standalone release, not the Hugo-bundled transpiler -- Toha's SCSS uses Dart Sass
      # module features (custom functions, @use) that need the real `dart-sass`/`sass`
      # binary on PATH, same as local dev (see justfile / README prerequisites).
      - name: Install Dart Sass
        run: |
          curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "$PWD/dart-sass" >> "$GITHUB_PATH"

      - name: Install Hugo CLI
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "hugo_extended_${HUGO_VERSION}_linux-amd64.deb"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Fetch Hugo Modules
        run: hugo mod tidy

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo \
            --gc --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
