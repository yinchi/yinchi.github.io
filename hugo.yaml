baseURL: "https://yinchi.dev/"
locale: "en-us"
title: "Yin-Chi Chan"

module:
  imports:
    - path: github.com/hugo-toha/toha/v4
      # Explicit mounts (mirroring Toha's own hugo.yaml) so the "content" mount below can
      # add excludeFiles: the module's content/search/_content.gotmpl generates the
      # (now-unlinked, since the sidebar search box is gone) /search/ page programmatically
      # -- it's not a regular content file we can just delete from our own content/, so
      # it has to be excluded at the mount level instead.
      mounts:
        - source: content
          target: content
          excludeFiles: "search/**"
        - source: static
          target: static
        - source: layouts
          target: layouts
        - source: data
          target: data
        - source: assets
          target: assets
        - source: i18n
          target: i18n
        - source: archetypes
          target: archetypes
        - source: ../../node_modules/flag-icons/flags
          target: static/flags
        - source: ../../node_modules/@fontsource/mulish/files
          target: static/files
        - source: ../../node_modules/katex/dist/fonts
          target: static/fonts

params:
  footer:
    newsletter:
      enable: false

  features:
    theme:
      enable: true
      # Default new visitors (empty localStorage) to the "light" scheme explicitly, rather
      # than Toha's own default of "system" -- with "system", the navbar theme icon starts
      # as the computer/system icon, which is less immediately recognizable as a light/dark
      # toggle than the sun/moon icons the light/dark options themselves use.
      services:
        default: light

    blog:
      enable: true
      title: "Blog"

    math:
      enable: true
      services:
        katex: {}
